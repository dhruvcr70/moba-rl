[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moba-rl"
version = "0.1.0"
description = "A three-lane MOBA-inspired reinforcement-learning research environment"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium>=1.0,<2.0",
    "numpy>=1.26,<3.0",
    "stable-baselines3>=2.4,<3.0",
    "sb3-contrib>=2.4,<3.0",
    "torch>=2.2",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]
tracking = ["wandb>=0.17"]
visualization = ["pygame>=2.5"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
all = [
    "pytest>=8.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "wandb>=0.17",
    "pygame>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["moba_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
